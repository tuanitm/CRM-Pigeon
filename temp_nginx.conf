#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # ---------------------------
    # CRM PIGEON HTTP SERVER
    # ---------------------------
    server {
        listen 80;
        server_name crm.imv.com.vn;
        
        # Let's Encrypt Verification Rule
        location /.well-known/acme-challenge/ {
            root C:/Soft/nginx-1.28.2/html;
        }

        # Redirect all other HTTP traffic to secure HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------------------------
    # CRM PIGEON HTTPS SERVER (SSL)
    # ---------------------------
    server {
        listen 443 ssl;
        server_name crm.imv.com.vn;

        ssl_certificate      C:/Soft/nginx-1.28.2/ssl/crm.imv.com.vn-chain.pem;
        ssl_certificate_key  C:/Soft/nginx-1.28.2/ssl/crm.imv.com.vn-key.pem;

        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Backend API Proxy
        location /v1/ {
            proxy_pass http://127.0.0.1:5170/v1/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Customer Portal (Dev Server Proxy)
        location /portal/ {
            proxy_pass http://127.0.0.1:5174/portal/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Zalo MiniApp (Dev Server Proxy)
        location /zalo/ {
            proxy_pass http://127.0.0.1:5175/zalo/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Admin Dashboard (Dev Server Proxy)
        location / {
            proxy_pass http://127.0.0.1:5173/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
