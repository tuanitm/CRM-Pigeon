server {
    listen 80;
    server_name localhost;

    # Customer Portal
    location / {
        alias /usr/share/nginx/html/portal/;
        try_files $uri $uri/ /index.html;
    }

    # Admin Dashboard
    location /admin {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /admin/index.html;
    }

    # Zalo MiniApp
    location /zalo {
        alias /usr/share/nginx/html/zalo/;
        try_files $uri $uri/ /zalo/index.html;
    }
}
